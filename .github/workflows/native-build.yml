name: Native inspector and player source checks
on: [push, pull_request, workflow_dispatch]
jobs:
  inspector:
    runs-on: windows-latest
    env:
      DVD2HEVC_STATE_DIR: ${{ runner.temp }}/dvd2hevc-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . meson ninja
      - run: python dvd2hevc.py build-inspector
      - uses: actions/upload-artifact@v4
        with:
          name: native-build-provenance
          path: ${{ runner.temp }}/dvd2hevc-native/tools/DVD2HEVC-NATIVE-BUILD.json
  player-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned clean VLC source and patch
        run: |
          git clone --filter=blob:none --no-checkout https://code.videolan.org/videolan/vlc.git /tmp/vlc-source
          git -C /tmp/vlc-source checkout 578d28f6c9f2379164516e689418f92ac74a3445
          git -C /tmp/vlc-source apply --check "$GITHUB_WORKSPACE/patches/vlc/0001-dvdnav-accept-hevc-program-stream-maps.patch"
          git -C /tmp/vlc-source apply "$GITHUB_WORKSPACE/patches/vlc/0001-dvdnav-accept-hevc-program-stream-maps.patch"
